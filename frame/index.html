<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Daily games</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      .game { position: fixed; inset: 0; }
      /* The measuring ladder, for the frame on its own: plain DOM. */
      .ladder { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; justify-content: center;
        gap: 12px; padding: 24px; box-sizing: border-box; background: #12101f; color: #fff;
        font: 600 15px/1.3 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .ladder .title { font-size: 20px; text-align: center; margin-bottom: 8px; }
      .ladder button { font: inherit; border: 0; border-radius: 12px; padding: 14px 16px; text-align: left; }
      .ladder .switch { background: transparent; color: #ffcc33; text-align: center; }
      .ladder .step { background: #ffcc33; color: #1a1400; }
      .ladder .step.done { background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.7); }
      .ladder .step:disabled:not(.done) { opacity: 0.6; }
    </style>
  </head>
  <body>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
